<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Accounts — Fongoh Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary-emerald: #10B981;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(16, 185, 129, 0.12);
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: 'Inter', sans-serif;
    }

    /* Tabs Styling */
    .header-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: #9ca3af;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary-emerald);
      color: #ffffff;
      border-color: var(--primary-emerald);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }

    /* Search Box */
    .search-box {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
      box-sizing: border-box;
      margin-bottom: 20px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--primary-emerald);
    }

    /* Grid Layout */
    .account-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .account-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
    }

    .account-card:hover {
      border-color: var(--primary-emerald);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.2);
    }

    .account-card.sold-out {
      opacity: 0.6;
    }

    .account-img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px;
    }

    .account-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin: 4px 0;
      line-height: 1.3;
    }

    .account-price {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-emerald);
      margin: 6px 0;
    }

    .account-stock {
      font-size: 12px;
      color: #9ca3af;
    }

    .badge-sold-out {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 8px;
      margin-top: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    .buy-btn {
      width: 100%;
      background: var(--primary-emerald);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .buy-btn:hover {
      filter: brightness(1.1);
    }

    /* Tab Display Control */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

  <a href="index.html" class="menu-btn back-btn" aria-label="Back to dashboard">‹</a>

  </div>
</header>

<main class="content" style="padding-bottom: 90px; max-width: 600px; margin: 0 auto;">

  <!-- Header Tabs -->
  <div class="header-tabs">
    <button class="tab-btn active" onclick="switchTab('buy')">Buy accounts</button>
    <button class="tab-btn" onclick="switchTab('bought')">Bought accounts</button>
  </div>

  <!-- BUY ACCOUNTS TAB -->
  <section id="buySection" class="tab-content active">
    <input type="text" id="searchInput" class="search-box" placeholder="Search available accounts..." onkeyup="filterAccounts()">

    <div class="account-grid" id="accountsContainer">
      <p style="color:#9ca3af; font-size:14px; text-align:center; grid-column: 1/-1; padding: 20px 0;">Loading available accounts...</p>
    </div>
  </section>

  <!-- BOUGHT ACCOUNTS TAB -->
  <section id="boughtSection" class="tab-content">
    <div class="account-grid" id="boughtContainer">
      <p style="color:#9ca3af; font-size:14px; text-align:center; grid-column: 1/-1; padding: 20px 0;">Loading purchased accounts...</p>

  </section>

</main>
