<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Fongoh Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<main class="auth-wrap">
  <div class="auth-logo">Fongoh<span>Hub</span></div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign in</button>
      <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign up</button>
    </div>

    <p class="auth-sub" id="authSub">Sign in to manage your orders, wallet, and account settings.</p>

    <div id="authError" class="auth-error hidden"></div>

    <button type="button" class="google-btn" id="googleBtn">
      <img src="https://www.google.com/s2/favicons?sz=64&domain_url=google.com" alt="Google">
      Continue with Google
    </button>

    <div class="divider"><span>or</span></div>

    <form id="authForm">
      <div class="field-group hidden" id="nameField">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name">
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="field-group hidden" id="confirmField">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
      </div>

      <label class="terms-row hidden" id="termsRow">
        <input type="checkbox" id="termsCheck">
        <span>I agree to the Terms & Privacy Policy</span>
      </label>

      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
    </form>

    <p class="auth-foot" id="forgotRow">
      <a href="#" id="forgotLink">Forgot your password?</a>
    </p>
  </div>

  <p class="auth-legal"><a href="welcome.html">‹ Back to home</a></p>
</main>

<script type="module" src="script.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
