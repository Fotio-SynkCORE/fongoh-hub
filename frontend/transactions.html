<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Fongoh Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .sidebar { max-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; box-sizing: border-box; padding-bottom: 30px; }
  .filter-panel { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 16px; margin-top: 12px; display: none; flex-direction: column; gap: 12px; }
  .filter-panel.open { display: flex; }
  .search-input-box { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; box-sizing: border-box; }
  .filter-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px 16px; color: #fff; width: 100%; text-align: left; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
  .select-input, .date-input, .number-input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box; }
  .empty-state-box { background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 24px; text-align: center; color: var(--text-muted, #a1a1aa); font-size: 14px; }
  
  .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
  .status-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
  .status-failed { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Sidebar Drawer -->
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <button class="close-btn" aria-label="Close menu">&times;</button>
  <div class="logo">Fongoh<span>Hub</span></div>
  <ul>
    <li onclick="window.location.href='dashboard.html'"><span class="dot"></span>Dashboard</li>
    <li onclick="window.location.href='boost-history.html'"><span class="dot"></span>Boost History</li>
    <li onclick="window.location.href='add-funds.html'"><span class="dot"></span>Add Funds</li>
    <li onclick="window.location.href='announcements.html'"><span class="dot"></span>Announcements</li>
    <li onclick="window.location.href='transactions.html'"><span class="dot"></span>Transactions</li>
    <li onclick="window.location.href='referrals.html'"><span class="dot"></span>Referrals</li>
    <li onclick="window.location.href='api.html'"><span class="dot"></span>API</li>
    <li onclick="window.location.href='account.html'"><span class="dot"></span>Profile</li>
  </ul>
  <button class="submit-btn signout-btn" id="signOutBtn">Sign out</button>
</aside>

<!-- Top bar -->
<header class="topbar">
  <button class="menu-btn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <div class="titles">
    <p class="eyebrow">Client dashboard</p>
    <h1>Transactions</h1>
  </div>
  <a href="account.html" class="avatar" id="topAvatar">--</a>
</header>

<main class="content" style="padding-bottom: 90px;">
  <div class="stat-card" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 20px;">
    <h2 style="font-size: 24px; margin-bottom: 6px;">Transactions</h2>
    <p style="color: var(--text-muted, #a1a1aa); font-size: 13px; line-height: 1.5; margin-bottom: 18px;">
      Every top-up, purchase, and wallet movement linked to your account.
    </p>

    <!-- Search Input -->
    <input type="text" id="searchInput" class="search-input-box" placeholder="🔍  Search transactions...">

    <!-- Toggle Filters Button -->
    <button class="filter-btn" id="toggleFilterBtn" style="margin-top: 10px;">
      <span>⚙️ Filters</span>
      <span id="filterArrow">▼</span>
    </button>

    <!-- Filter Collapsible Panel -->
    <div class="filter-panel" id="filterPanel">
      <div>
        <label style="font-size: 11px; color: var(--text-muted, #a1a1aa); font-weight: 700; text-transform: uppercase;">Status</label>
        <select id="statusFilter" class="select-input" style="margin-top: 4px;">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed / Success</option>
          <option value="failed">Failed</option>
        </select>
      </div>

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label style="font-size: 11px; color: var(--text-muted, #a1a1aa); font-weight: 700; text-transform: uppercase;">From date</label>
          <input type="date" id="fromDate" class="date-input" style="margin-top: 4px;">
        </div>
        <div style="flex: 1;">
          <label style="font-size: 11px; color: var(--text-muted, #a1a1aa); font-weight: 700; text-transform: uppercase;">To date</label>
          <input type="date" id="toDate" class="date-input" style="margin-top: 4px;">
        </div>
      </div>

      <div>
        <label style="font-size: 11px; color: var(--text-muted, #a1a1aa); font-weight: 700; text-transform: uppercase;">Amount range (XAF)</label>
        <div style="display: flex; gap: 10px; align-items: center; margin-top: 4px;">
          <input type="number" id="minAmount" class="number-input" placeholder="Min">
          <span style="color: var(--text-muted, #a1a1aa);">-</span>
          <input type="number" id="maxAmount" class="number-input" placeholder="Max">
        </div>
      </div>
    </div>

    <!-- Record Count Indicator -->
    <div id="txCountLabel" style="font-size: 12px; color: var(--text-muted, #a1a1aa); margin-top: 16px; margin-bottom: 12px;">
      Loading transactions...
    </div>

    <!-- Transactions List Container -->
    <div id="transactionsContainer" style="display: flex; flex-direction: column; gap: 10px;">
      <div class="empty-state-box">Loading transactions...</div>
    </div>
  </div>
</main>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="dashboard-auth.js"></script>
<script type="module" src="transactions.js"></script>
</body>
</html>
