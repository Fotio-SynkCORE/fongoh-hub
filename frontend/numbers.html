<style>
  .platform-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
    padding-bottom: 80px; /* Spacing so items aren't covered by bottom nav */
  }

  .platform-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .platform-card:hover {
    background: rgba(16, 185, 129, 0.12);
    border-color: #10B981;
    transform: translateY(-2px);
  }

  .platform-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
  }

  /* Fix for colored SVG icons inside platform badge */
  .platform-icon svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .platform-info h4 {
    margin: 0;
    font-size: 15px;
    color: #fff;
  }

  .platform-info p {
    margin: 2px 0 0 0;
    font-size: 12px;
    color: #aaa;
  }

  .search-box {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: #fff;
    box-sizing: border-box;
    margin-top: 12px;
  }
</style>
