<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Country — Fongoh Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .country-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }
    .country-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .country-card:hover {
      background: rgba(16, 185, 129, 0.12);
      border-color: #10B981;
      transform: translateY(-2px);
    }
    .country-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .country-flag {
      width: 36px;
      height: 26px;
      border-radius: 4px;
      object-fit: cover;
    }
    .country-details h4 {
      font-size: 15px;
      margin: 0;
      color: #fff;
    }
    .country-details p {
      font-size: 12px;
      color: #aaa;
      margin: 2px 0 0 0;
    }
    .price-badge {
      background: #10B981;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3);
      color: #fff;
      box-sizing: border-box;
      margin-top: 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #10B981;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header class="topbar">
  <a href="numbers.html" class="menu-btn back-btn" aria-label="Back">‹</a>
  <div class="titles">
    <p class="eyebrow">Client Dashboard</p>
    <h1 id="headerTitle">Country Selection</h1>
  </div>
</header>

<main class="content">

  <a href="numbers.html" class="back-link">‹ Back to platform list</a>

  <section class="auth-card">
    <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #10B981;">Step 2 of 3</span>
    <h2 id="serviceTitle" style="margin-top: 8px; font-size: 20px;">Country Selection</h2>
    <p class="row-sub">Choose a country to view live stock for this platform.</p>
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search country...">
  </section>

  <section class="country-list" id="countryContainer"></section>

</main>
